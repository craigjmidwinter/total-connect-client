blank_issues_enabled: true
contact_links:
  - name: Home Assistant integration issue
    url: https://github.com/home-assistant/core/issues
    about: >-
      If you're using the TotalConnect integration through Home Assistant
      (not calling this Python package directly), file your issue in the
      Home Assistant core repository instead — this repo only covers the
      total_connect_client package itself.
  - name: Is it a TotalConnect/Resideo outage?
    url: https://status.resideo.com/
    about: >-
      Before filing a bug here, check the Resideo status page. If there's a
      known outage or incident, it's probably not a bug in this package.
