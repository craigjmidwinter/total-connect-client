name: Bug Report
description: Help us identify and fix bugs by filling out the details below.
title: "[BUG]: <short description>"
labels: [bug, needs-triage]
assignees: [austinmroczek]
projects: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible.

  - type: input
    id: bug-summary
    attributes:
      label: Bug Summary
      description: A brief description of the issue.
      placeholder: "e.g., 'Alarm reports wrong status'"

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Your alarm hardware model/version.
      placeholder: "ProA7, Lynx Touch, Vista 21, etc"

  - type: dropdown
    id: environment
    attributes:
      label: Home Assistant or total_connect_client?
      multiple: false
      options:
        - Home Assistant
        - total_connect_client

  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the software you chose above (Home Assistant or total_connect_client).
      placeholder: "e.g., 2025.9.2"

  - type: markdown
    attributes:
      value: |
        > ⚠️ **Scrub the log output below before you post it.** This issue is
        > public. Logs from this package can contain your **TotalConnect
        > username**, **OAuth access/refresh tokens**, and — depending on how
        > the client was used — your **alarm usercode**.
        >
        > A `test.log` from `python3 -m total_connect_client` contains the
        > username and tokens. It will *not* contain a usercode, because that
        > command never supplies one. A usercode reaches the logs when your
        > own code constructs the client **with** usercodes, or when one is
        > rejected — `validate_usercode()` logs the rejected code at `ERROR`.
        > Note that `ERROR` and the username's `WARNING` are both visible
        > without debug logging enabled.
        >
        > Remove: username, password, every usercode, OAuth/session tokens,
        > and location/device/zone IDs. When in doubt, redact it — a
        > maintainer can ask for it back. See
        > [SECURITY.md](https://github.com/craigjmidwinter/total-connect-client/blob/master/SECURITY.md)
        > for the full list.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (scrubbed — see the warning above)
      description: Paste the relevant log output, with credentials and identifiers removed. This is automatically formatted as code, so no backticks needed.
      render: shell

  - type: textarea
    id: other
    attributes:
      label: Other information
      description: Any other information that may be useful, such as additional hardware information (sensors) or a description of what the panel did or didn't do.
